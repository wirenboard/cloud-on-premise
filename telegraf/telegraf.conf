# Telegraf — single-node on-premise metrics ingestion.
# Receives controller metrics (Influx line protocol) over HTTPS via Traefik
# (mTLS + rate limiting) and writes them into TimescaleDB.
#
# ${VAR} placeholders are expanded by Telegraf from the container environment.
# Differences from upstream: the Prometheus output / internal-metrics branch is
# dropped (no Prometheus server is bundled on-premise), and the TimescaleDB
# connection goes straight to the single "timescale" service (no HAProxy).

[agent]
  flush_interval = "5s"
  metric_batch_size = 10000
  metric_buffer_limit = 500000
  hostname = "telegraf"
  skip_processors_after_aggregators = true
  debug = false

# Приём метрик от агентов через Influx line protocol.
[[inputs.http_listener_v2]]
  service_address = ":8081"
  paths = ["/metrics"]
  methods = ["POST"]
  data_format = "influx"
  [inputs.http_listener_v2.http_header_tags]
    X-Forwarded-Tls-Client-Cert-Info = "__tls_info"
    Content-Length = "__content_length"

# Извлекаем Serial Number из сертификата в тег host.
[[processors.regex]]
  namepass = ["*"]
  [[processors.regex.tags]]
    key = "__tls_info"
    pattern = "^.*Subject%3[dD]%22CN%3[dD]wirenboard-([A-Z0-9-]{5,25})%22.*$"
    replacement = "${1}"
    result_key = "host"

# Запись в TimescaleDB (один инстанс, без HAProxy).
[[outputs.postgresql]]
  connection = "host=timescale port=5432 user=${TELEGRAF_TIMESCALE_USER} password=${TELEGRAF_TIMESCALE_PASSWORD} dbname=${TIMESCALE_DB} sslmode=disable connect_timeout=5"
  tags_as_jsonb = false
  fields_as_jsonb = false
  schema = "public"
  tagexclude = ["__tls_info", "__content_length"]
  namedrop = ["controller_traffic"]
  # Шаблоны выполняются ТОЛЬКО если таблицы ещё нет; вся логика в ensure_measurement из init.sql.
  create_templates = [
    "CALL ensure_measurement(trim(both '\"' from split_part('{{ .table }}', '.', 2)));"
  ]
