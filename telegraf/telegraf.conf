# Telegraf — single-node on-premise metrics ingestion.
# Receives controller metrics (Influx line protocol) over HTTPS via Traefik
# (mTLS + rate limiting) and writes them into TimescaleDB.
#
# ${VAR} placeholders are expanded by Telegraf from the container environment.
#
# Deliberate differences from upstream, so the next comparison is not read as drift:
# no Prometheus output / internal metrics (none is bundled here), no HAProxy, and
# smaller buffers everywhere but the cold stream, which has to sit out a compression
# run without dropping a backfill.

[agent]
  flush_interval = "5s"
  metric_batch_size = 10000
  metric_buffer_limit = 500000
  hostname = "telegraf"
  skip_processors_after_aggregators = true
  debug = false

# Metrics arrive from the agents over the Influx line protocol.
[[inputs.http_listener_v2]]
  service_address = ":8081"
  paths = ["/metrics"]
  methods = ["POST"]
  data_format = "influx"
  [inputs.http_listener_v2.http_header_tags]
    X-Forwarded-Tls-Client-Cert-Info = "__tls_info"
    Content-Length = "__content_length"

# Lift the serial number out of the certificate into the host tag.
[[processors.regex]]
  namepass = ["*"]
  [[processors.regex.tags]]
    key = "__tls_info"
    pattern = "^.*Subject%3[dD]%22CN%3[dD]wirenboard-([A-Z0-9-]{5,25})%22.*$"
    replacement = "${1}"
    result_key = "host"

# While a chunk is compressed, inserting a row that belongs to it waits for the
# lock — in one stream that single late row stalls everyone's fresh metrics.
[[processors.starlark]]
  namepass = ["*"]
  source = '''
load("time.star", "time")

COLD_AGE_NS = 6 * 24 * 60 * 60 * 1000000000  # compression_after (7 days in init.sql) - 1

def apply(metric):
    if time.now().unix_nano - metric.time > COLD_AGE_NS:
        metric.tags["route"] = "cold"
    else:
        metric.tags["route"] = "hot"
    return metric
'''

# Write to TimescaleDB (a single instance, no HAProxy).
[[outputs.postgresql]]
  alias = "postgresql_hot"
  connection = "host=timescale port=5432 user=${TELEGRAF_TIMESCALE_USER} password=${TELEGRAF_TIMESCALE_PASSWORD} dbname=${TIMESCALE_DB} sslmode=disable connect_timeout=5"
  tags_as_jsonb = false
  fields_as_jsonb = false
  schema = "public"
  metric_buffer_limit = 500000
  tagexclude = ["__tls_info", "__content_length", "route"]
  namedrop = ["controller_traffic"]
  # Templates run ONLY when the table is missing; the logic lives in ensure_measurement (init.sql).
  create_templates = [
    "CALL ensure_measurement(trim(both '\"' from split_part('{{ .table }}', '.', 2)));"
  ]
  # tagpass has to be last in the plugin section — a quirk of the config parser.
  tagpass = { route = ["hot"] }

[[outputs.postgresql]]
  alias = "postgresql_cold"
  connection = "host=timescale port=5432 user=${TELEGRAF_TIMESCALE_USER} password=${TELEGRAF_TIMESCALE_PASSWORD} dbname=${TIMESCALE_DB} sslmode=disable connect_timeout=5"
  tags_as_jsonb = false
  fields_as_jsonb = false
  schema = "public"
  metric_buffer_limit = 200000
  tagexclude = ["__tls_info", "__content_length", "route"]
  namedrop = ["controller_traffic"]
  # Templates run ONLY when the table is missing; the logic lives in ensure_measurement (init.sql).
  create_templates = [
    "CALL ensure_measurement(trim(both '\"' from split_part('{{ .table }}', '.', 2)));"
  ]
  # tagpass has to be last in the plugin section — a quirk of the config parser.
  tagpass = { route = ["cold"] }
