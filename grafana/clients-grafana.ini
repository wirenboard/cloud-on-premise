; clients-grafana — per-organisation dashboards for cloud users.
; Values in ${...} are expanded by Grafana from the container environment.
instance_name = clients-grafana

[database]
; Grafana's INTERNAL config DB (dashboards / users / orgs) — built-in SQLite,
; persisted on the clientsGrafanaData volume (/var/lib/grafana). This is isolated
; from the metrics store: TimescaleDB remains Grafana's *datasource* (configured
; separately), and the backend talks to Grafana over HTTP only.
type = sqlite3
path = grafana.db

[server]
root_url = https://metrics.${ABSOLUTE_SERVER}/

[security]
disable_initial_admin_creation = false
admin_user = ${GF_SECURITY_ADMIN_USER}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
cookie_secure = true

[quota]
enabled = true
org_alert_rule = 0
org_data_source = 1
org_user = 200
org_dashboard = 20
org_api_key = 0
user_org = -1

[unified_alerting]
enabled = false
execute_alerts = false

[alerting]
enabled = false

[users]
allow_sign_up = false
allow_org_create = false

[auth]
disable_login_form = false
signout_redirect_url = https://${ABSOLUTE_SERVER}/
token_rotation_interval_minutes = 720
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[metrics]
enabled = true
disable_total_stats = false
