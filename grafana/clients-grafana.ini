; clients-grafana — per-organisation dashboards for cloud users.
; Values in ${...} are expanded by Grafana from the container environment.
instance_name = clients-grafana

[database]
; Grafana's INTERNAL config DB (dashboards / users / orgs) — built-in SQLite,
; persisted on the clientsGrafanaData volume (/var/lib/grafana). This is isolated
; from the metrics store: TimescaleDB remains Grafana's *datasource* (configured
; separately), and the backend talks to Grafana over HTTP only.
type = sqlite3
path = grafana.db

[server]
root_url = https://metrics.${ABSOLUTE_SERVER}/

[security]
disable_initial_admin_creation = false
admin_user = ${GF_SECURITY_ADMIN_USER}
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
cookie_secure = true

; Avatars from gravatar.com would carry hashes of user emails off the instance.
disable_gravatar = true

; A dashboard reachable by link without a login defeats organization isolation.
[public_dashboards]
enabled = false

; Snapshots open by link without auth, and external ones leave the instance.
[snapshots]
enabled = false
external_enabled = false

[analytics]
check_for_updates = false
check_for_plugin_updates = false
reporting_enabled = false
feedback_links_enabled = false

[news]
news_feed_enabled = false

[dashboards]
min_refresh_interval = 30s

[quota]
enabled = true
org_alert_rule = 20
global_alert_rule = -1
alerting_rule_evaluation_results = 100
org_data_source = 1
org_user = 200
org_dashboard = 20
org_api_key = 0
user_org = -1

[unified_alerting]
enabled = true
execute_alerts = true
min_interval = 30s

[annotations.alert]
max_age = 30d

; Grafana sends alert mail through its own SMTP — the one .env sets for the cloud.
[smtp]
enabled = ${EMAIL_ENABLED}
host = ${EMAIL_HOST}:${EMAIL_PORT}
user = ${EMAIL_HOST_USER}
password = """${EMAIL_HOST_PASSWORD}"""
from_address = ${EMAIL_NOTIFICATIONS_FROM}
from_name = ${SERVICE_NAME}
startTLS_policy = MandatoryStartTLS

[plugins]
; The Drilldown section is useless here: those plugins work with Loki/Tempo/Pyroscope,
; while an organization's only data source is postgres.
preinstall_disabled = true
disable_plugins = grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-exploretraces-app,grafana-pyroscope-app

[feature_toggles]
correlations = false

[users]
allow_sign_up = false
allow_org_create = false

[auth]
disable_login_form = false
signout_redirect_url = https://${ABSOLUTE_SERVER}/
token_rotation_interval_minutes = 720
login_maximum_inactive_lifetime_duration = 7d
login_maximum_lifetime_duration = 30d

[metrics]
enabled = true
disable_total_stats = false
