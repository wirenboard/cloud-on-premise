name: Build all on-premise images

on:
  workflow_dispatch:
    inputs:
      REGISTRY:
        description: "Registry"
        type: choice
        required: true
        default: ghcr.io
        options:
          - ghcr.io
          - registry.wirenboard.com
      TARGET:
        description: "Target"
        required: true
        type: choice
        default: release
        options:
          - release
          - testing
      REF:
        description: "Branch name to build from"
        required: false
        type: string

jobs:
  read_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: read_version
        shell: bash
        run: |
          VERSION=$(cat VERSION | tr -d '\r' | xargs)
          if [[ -z "$VERSION" ]]; then
            echo "Error: version file is empty"; exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: invalid version format, must be X.Y.Z"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
    outputs:
      image_version: ${{ steps.read_version.outputs.VERSION }}

  dispatch-all:
    needs: read_version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      dispatched_after: ${{ steps.dispatch.outputs.since }}
    steps:
      - uses: actions/checkout@v6

      - id: dispatch
        name: Dispatch to the product repositories
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY: ${{ inputs.REGISTRY }}
          TARGET: ${{ inputs.TARGET }}
          IMAGE_VERSION: ${{ needs.read_version.outputs.image_version }}
          REF: ${{ inputs.REF || github.ref_name }}
        run: .github/scripts/dispatch-receivers.sh cloud-backend cloud-frontend cloud-tunnel cloud-webssh

  wait-builds:
    needs: [read_version, dispatch-all]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6

      - name: Wait for the image builds in the product repositories
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DISPATCHED_AFTER: ${{ needs.dispatch-all.outputs.dispatched_after }}
        run: .github/scripts/wait-receivers.sh "$DISPATCHED_AFTER" cloud-backend cloud-frontend cloud-tunnel cloud-webssh

  check-version-label:
    needs: [read_version, wait-builds]
    if: inputs.REGISTRY == 'ghcr.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Backend images carry on-premise.version = X.Y.Z
        env:
          VERSION: ${{ needs.read_version.outputs.image_version }}
          TARGET: ${{ inputs.TARGET }}
        run: |
          set -euo pipefail
          TAG="$VERSION"
          [[ "$TARGET" == "release" ]] || TAG="$VERSION-$TARGET"
          python3 .github/scripts/registry_check.py label --version "$VERSION" --tag "$TAG"
