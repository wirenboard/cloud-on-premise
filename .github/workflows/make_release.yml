name: Release On-Premise

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - VERSION

env:
  REGISTRY: ghcr.io
  VERSION_FILE: ./VERSION

jobs:
  read-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read_version.outputs.VERSION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read version from VERSION file
        id: read_version
        shell: bash
        run: |
          set -e
          VERSION=$(cat VERSION | tr -d '\r' | xargs)
          if [[ -z "$VERSION" ]]; then
            echo "::error::VERSION file is empty"; exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid VERSION format: '$VERSION' (expected X.Y.Z)"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

  retag-and-push:
    needs: read-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: wbc-backend,       repo: cloud-backend }
          - { image: wbc-worker,        repo: cloud-backend }
          - { image: wbc-agent-backend, repo: cloud-backend }
          - { image: wbc-scheduler,     repo: cloud-backend }
          - { image: wbc-frontend,      repo: cloud-frontend }
          - { image: wbc-tunnel,        repo: cloud-tunnel }
          - { image: wbc-tunnel-auth,   repo: cloud-tunnel }
          - { image: wbc-webssh,        repo: cloud-webssh }
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag and push image ${{ matrix.image }}
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          VERSION=${{ needs.read-version.outputs.version }}
          IMAGE=${{ matrix.image }}

          SOURCE_IMAGE="${REGISTRY}/${{ github.repository_owner }}/on-premise/${IMAGE}:${VERSION}-testing"
          TARGET_IMAGE="${REGISTRY}/${{ github.repository_owner }}/on-premise/${IMAGE}:${VERSION}"
          LATEST_IMAGE="${REGISTRY}/${{ github.repository_owner }}/on-premise/${IMAGE}:latest"

          echo "Retagging $SOURCE_IMAGE → $TARGET_IMAGE, $LATEST_IMAGE"

          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker tag "$SOURCE_IMAGE" "$LATEST_IMAGE"
          docker push "$TARGET_IMAGE"
          docker push "$LATEST_IMAGE"

          SHA=$(gh api "repos/${{ github.repository_owner }}/${{ matrix.repo }}/branches/onprem-release/${VERSION}" --jq .commit.sha 2>/dev/null || true)
          if [[ -n "$SHA" ]]; then
            SHA_IMAGE="${REGISTRY}/${{ github.repository_owner }}/on-premise/${IMAGE}:${SHA}"
            echo "Tagging $SHA_IMAGE"
            docker tag "$SOURCE_IMAGE" "$SHA_IMAGE"
            docker push "$SHA_IMAGE"
          else
            echo "::warning::${{ matrix.repo }} has no onprem-release/${VERSION} branch — skipping sha tag for ${IMAGE}"
          fi

  create-release:
    needs: [read-version, retag-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract changelog section for release notes
        shell: bash
        run: |
          VERSION=${{ needs.read-version.outputs.version }}
          {
            awk -v ver="$VERSION" '$0 ~ "^## \\["ver"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
            echo ""
            echo "---"
            echo ""
            awk -v ver="$VERSION" '$0 ~ "^## \\["ver"\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG_EN.md
          } > /tmp/release_notes.md
          if [[ ! -s /tmp/release_notes.md ]]; then
            echo "::warning::CHANGELOG.md has no section for ${VERSION} — release body will be empty"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.read-version.outputs.version }}
          name: Release v${{ needs.read-version.outputs.version }}
          body_path: /tmp/release_notes.md
          files: |
            VERSION
            CHANGELOG.md
            CHANGELOG_EN.md
            RELEASE_NOTES_2.0.md
            RELEASE_NOTES_2.0_EN.md
            LICENSE
            README.md
            README_EN.md
            Makefile
            .env.example
            docker-compose.yml
            traefik/**
            jwt/**
            scripts/**
            timescale/**
            telegraf/**
            grafana/**
            migration/**

      - name: Done
        run: echo "✅ Release completed for version ${{ needs.read-version.outputs.version }}"